# ==============================================================================
# Workflows
# ==============================================================================
workflows:
  dream_to_world:
    description: "Full end-to-end happy path (P0 asset pipeline)"
    steps:
      - "1. User types/speaks dream on /"
      - "2. dreamText saved to localStorage, navigate to /loading-dream"
      - "3. POST /api/analyze (LLM → normalized GameConfig via parseGameConfigExtended). Result saved to localStorage.gameConfig."
      - "4. Mint or reuse generationId. /loading-dream fires fetch('/api/generate-3d') and fetch('/api/generate-assets') as TRUE fire-and-forget — no AbortSignal tied to the navigation lifecycle. The requests survive the route change to /play."
      - "5. Navigate to /play immediately after analyze settles (or hard timer fires). gameConfig + generationId are already in localStorage; gameAssets may still be undefined at this point."
      - "6. /play mounts DreamGame3D with procedural placeholders. It registers two listeners: window 'dreamAssetsUpdated' (same-tab) and window 'storage' (cross-tab)."
      - "7. As each asset job finishes, /loading-dream (still alive in memory until GC) writes to localStorage.gameAssets via mergeAssetResponses() and dispatches dreamAssetsUpdated event."
      - "8. /play's listeners push the new asset URLs into DreamGame3D props. drei's useGLTF / useTexture consumers suspend, swap the procedural placeholder for the real asset under React Suspense, no page reload."
      - "9. Player completes/fails; 'New Dream' clears localStorage and returns to /."
  hard_timeout_fallback:
    description: "What happens when AI services are slow or offline"
    steps:
      - "1. Analyze takes >25s OR returns 200 with fallback body → loading-dream proceeds with whatever GameConfig is available (LLM result or buildFallback)"
      - "2. Per Phase 3 fire-and-forget: assets/3D calls are NOT awaited before navigation — they continue in the background and update /play as they finish"
      - "3. Gradio Client.connect >15s OR HF probe says SLEEPING → /api/generate-3d returns fallbackOk; no GLBs this run"
      - "4. SD ping fails (2s probe) → /api/generate-assets returns nulls immediately; procedural visuals only"
      - "5. Client hard-timer (NEXT_PUBLIC_MAX_GENERATION_MS, default 75s) fires → navigate to /play with whatever gameConfig exists"
      - "6. If no gameConfig at all → buildFallback(dream) → /play with default scene"

