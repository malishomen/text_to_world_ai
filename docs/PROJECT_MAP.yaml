# ==============================================================================
# DreamCraft (text_to_world_ai) — Hackathon AI orchestrator: text → 3D world
# Static project map: structure, surfaces, env, deploy, workflows
# ==============================================================================
# This file = "what exists in the system" (verifiable from code).
# For history/causes/decisions → see memory.md.
# For behavior rules → see agent.md.
#
# Hard rule: kept in sync with code WITHOUT user reminders. See agent.md § 1.0.
# Validate after edits: python -c "import yaml; yaml.safe_load(open('docs/PROJECT_MAP.yaml', encoding='utf-8'))"
# ==============================================================================

project:
  name: DreamCraft
  purpose: "Hackathon AI orchestrator: spoken/typed dream → playable 3D world in <90s"
  language_audience: [en, ru]
  default_lang: en
  repository: github.com/malishomen/text_to_world_ai
  working_branch: test
  protected_branches: [main]
  current_version: 0.1.0
  status: development

architecture:
  topology: monorepo
  runtime_processes:
    - next_web:
        type: Next.js 16 (App Router, React 19)
        port: 3000
        entry: web/app/page.tsx
        notes: "Dev: `cd web && npm run dev`. Three.js + Rapier load client-side only (next/dynamic, ssr:false)."
    - lm_studio_or_ollama:
        type: "External — local LLM API (multi-model: Qwen3-coder for /api/analyze + LLaMA-Mesh for /api/generate-mesh)"
        port: 1234
        entry: external
        notes: "Optional. Endpoint configurable via QWEN_BASE_URL (shared by both endpoints). Default LM Studio :1234 (multi-model loading available in 0.4+; both Qwen3 ~6.7GB Q6_K and LLaMA-Mesh ~4.9GB Q4_K_M can be READY at once with enough RAM/VRAM). Ollama works at :11434. Fallback config used if down."
    - stable_diffusion_a1111:
        type: External — Automatic1111 WebUI API
        port: 7860
        entry: external
        notes: "Optional. SD_BASE_URL. Skipped via 2s health probe if down (Phase B)."
    - trellis_gradio:
        type: "External — TRELLIS image-to-3D (HF Space OR local Gradio). Default microsoft/TRELLIS.2 (PBR-materials, 3-stage pipeline)."
        port: 7861
        entry: external
        notes: "TRELLIS_URL = HF Space id (default microsoft/TRELLIS.2; legacy JeffreyXiang/TRELLIS-image-large still works) OR http URL. HF probe before connect (Phase B). HF Space requires HF_TOKEN. /api/generate-3d auto-detects v2 by URL substring."
    - python_orchestrator:
        type: Python — main.py (legacy v1 entry, currently unused by web flow)
        port: n/a
        entry: main.py
        notes: "Predates the Next.js app. Not in MVP critical path. See LEGACY.md."
  dataflow:
    - "User → /loading-dream → /api/analyze (Qwen) → gameConfig → /api/generate-3d (TRELLIS) ∥ /api/generate-assets (SD) ∥ /api/generate-mesh (LLaMA-Mesh) → /play → DreamGame3D (R3F+Rapier). Player fallback chain: TRELLIS GLB → LLaMA-Mesh OBJ → procedural mood-shape primitive."
    - "All artifacts persisted via localStorage between pages (no DB)."
    - "Phase 3: each generation isolated under public/generated/<id>/ and public/generated3d/<id>/ via generationId."

tech_stack:
  backend:
    language: TypeScript (Node 20+) + Python 3.11 (legacy orchestrator)
    framework: Next.js 16 App Router (route handlers as API)
    auth: none (single-user demo)
    deps_file: web/package.json, requirements.txt
    key_deps:
      - "next 16.2.6"
      - "react 19.2.4"
      - "zod 4 — runtime schema for GameConfig (Phase 2)"
      - "@gradio/client 2 — TRELLIS image→GLB pipeline"
      - "vitest 4 — unit tests for lib/ helpers (Phase 11; 213 cases as of P0)"
      - "@playwright/test 1.49 — e2e smoke suite (web/e2e/, headless Chromium)"
  frontend:
    type: SSR + client islands
    framework: "React 19 + Three.js 0.184 + @react-three/fiber 9 + @react-three/rapier 2 + @react-three/drei 10 (useGLTF + useTexture for asset consumption with Suspense fallbacks) + @react-three/postprocessing 3 (Bloom via EffectComposer) + Framer Motion 12 + Tailwind 4 + zod 4 + lucide-react"
    deps_file: web/package.json
  database:
    engine: none (localStorage only)
  infrastructure:
    container: bare (no docker yet for web)
    web_proxy: none
    cloud_targets: [Vercel (planned)]

# ==============================================================================
# Directory structure
# ==============================================================================
directory_structure:
  web/:
    app/:
      page.tsx: "Landing — dream input form. handleSubmit clears stale localStorage (gameConfig/gameAssets/generationId) before navigating to /loading-dream so each new dream gets a fresh level seed."
      loading-dream/page.tsx: "Loading screen — orchestrates analyze + fire-and-forget asset calls + hard timeout (Phase A) → /play"
      play/page.tsx: "Game shell — sidebar + DreamGame3D canvas; guards on gameConfig in localStorage"
      layout.tsx: "Root layout"
      globals.css: "Tailwind 4 globals"
      api/:
        analyze/route.ts: "POST — LLM → normalized GameConfig (zod + parseGameConfig); ≤5000-char dream guard; fallbackOk on failure"
        generate-3d/route.ts: "POST — SD → reference PNG → TRELLIS → 3 GLBs under public/generated3d/<generationId>/; optional Godot mirror"
        generate-assets/route.ts: "POST — SD → 3 PNG sprites under public/generated/<generationId>/; ~2s SD health probe"
        generate-mesh/route.ts: "POST — LLaMA-Mesh (LM Studio multi-model slot) → OBJ-text character mesh under public/generated3d/<generationId>/character.obj. Fully local, no API keys, ~50-60s per call."
        generate-narration/route.ts: "POST — ElevenLabs Turbo v2.5 → narrator MP3 under public/generated-tts/<generationId>.mp3. Cache-first idempotent; missing key → no-tts (Web Speech fallback client-side). Never 500."
    components/:
      CinematicIntro.tsx: "Tier S cinematic intro overlay. Mounts on /play, plays narrator audio (ElevenLabs MP3 or Web Speech fallback) + typewriter narrative + world-open stinger, then fades into the WebGL scene. Owns AudioEngine construction; parent /play disposes on unmount. 8-second fetch timeout on /api/generate-narration. pagehide + beforeunload safety net cancel speech on tab close."
      scene/:
        PostFX.tsx: "Bloom postprocessing wrapper. @react-three/postprocessing EffectComposer + Bloom (intensity 0.6, threshold 0.55, mipmapBlur, radius 0.85). Placed as a Canvas child after DreamScene so it intercepts the scene render."
        InstancedProps.tsx: "Per-mood instanced 'world props' scattered across the ground (~120-160 instances per dream). Eight mood variants: dead-spike-tree / giant-mushroom / antenna / asteroid / broken-column / glass-spire / candy-obelisk / floating-orb. Deterministic scatter via makeRng(hashString(generationId)); rejection-sampled against platformExclusions so props never spawn under the player's path. Zero per-frame allocations; asteroids rotate via cached Matrix4 + Quaternion refs."
        GroundMist.tsx: "Low-altitude transparent mist. 10-60 drei Billboard puffs with a CanvasTexture soft-disc alpha mask (generated once, disposed on unmount). Per-instance state in one Float32Array (6 floats). Seeded by levelSeed so the layout is reproducible per dream; wrap-around z values drawn from a 32-entry pre-computed RNG pool to keep useFrame allocation-free. density=0 short-circuits the layer (cosmic/ethereal voids)."
        DistantRidges.tsx: "Static PlaneGeometry 300×60 with 80×20 segments, per-vertex 2-octave value-noise displacement (peaks only on upper half, base flat). Faces +Z toward the camera at z=-levelDepth-80. flatShading + frustumCulled=false. Geometry disposed on unmount."
      DreamGame3D.tsx: |
        R3F Canvas: Player + Platforms + Enemies + GoalPortal + FollowCamera; seeded RNG via makeRng (Phase 6).
        Tone mapping: THREE.ACESFilmicToneMapping with toneMappingExposure 1.2 (set via onCreated). DO NOT pass numeric toneMapping values — `3` is CineonToneMapping (deprecated, overexposes to white), `4` is ACESFilmic; always use the THREE constant.
        World convention: right-handed; camera lives at player.z+16 looking toward -Z; level extends in -Z; W=-Z (forward), S=+Z, A=-X, D=+X. Reversing any one of these alone produces a mirrored render.
        Player collider: explicit <BallCollider args={[0.55]}/> with RigidBody colliders={false}. Never let Rapier auto-derive from the visual mesh — GLB/OBJ characters (especially LLaMA-Mesh with 0..64 coord range) cause oversized or off-center auto-colliders that make the player stuck on platform edges.
        Platform collider: explicit <CuboidCollider args={halfSize}/> with RigidBody colliders={false}. PlatformDecoration meshes (crystal/spire/orb/mushroom/neon) MUST live outside the RigidBody — when they were inside with colliders="cuboid" each decoration added its own auto-derived cuboid blocker on top of every platform (the neon torus produced an especially wide one), and players got stuck reaching the last-platform portal center.
        Per-mood visual presets via moodPresetFor(): 8 presets keyed by LLM `mood` enum (surreal_calm | dark_fantasy | cozy_dream | nightmare | cyber_dream | ethereal | whimsical | cosmic) drive playerShape (icosahedron/tetrahedron/octahedron/dodecahedron/sphere), platformDecoration (crystal/spire/orb/mushroom/neon), enemyShape, enemyColor, skyTopColor, skyBottomColor, groundColor, plus fog/lights/particles.
        Per-mood scene differentiators (beyond palette): MoodPreset.terrainType (none/hills/spikes/grid/cracks/rolling) feeds DisplacedGround; MoodPreset.particleType (sparkle/snow/sakura/neon_rain/embers/cosmic_dust) feeds AtmosphericParticles.
        Components: SkyDome (custom back-side sphere shader, zenith→horizon gradient), DisplacedGround (PlaneGeometry with deterministic value-noise + per-mood per-vertex displacement function — replaces the earlier flat-fill ground; visual-only, no collider, death plane at y=-12 still ends the run), AtmosphericParticles (InstancedMesh, ~150-500 instances driven by useFrame: snow falls, sakura sways + rotates, neon_rain vertical streaks, embers rise, cosmic_dust slow drift; sparkle keeps the original drei Sparkles), PlatformDecoration (non-physics flair on each non-spawn platform, lives in a sibling group OUTSIDE the platform RigidBody).
        Enter / NumpadEnter / Space restart the run from the win/dead overlays.
    lib/:
      fallback-config.ts: "buildFallback(dream) + GameConfig type (Phase A) — single source of truth for default configs"
      with-timeout.ts: "withTimeout(promise, ms, label) helper (Phase B)"
      rng.ts: "Shared deterministic LCG RNG + cheap string hash. Used by DreamGame3D (level/terrain seed), InstancedProps (prop scatter), GroundMist (puff layout)."
      image-gen.ts: "Shared image-gen backend for /api/generate-3d + /api/generate-assets. Dispatches by SD_BACKEND env: 'fal' → fal.ai FLUX schnell (~$0.005/image, 1.5s, no local GPU) or 'a1111' → local SD WebUI. Exports getImageGenProvider() for status + generateImage() unified entry."
      demo-presets.ts: "Tier S: 6 hand-tuned preset cards (nightmare/cozy_dream/cyber_dream/cosmic/whimsical/surreal_calm). Each preset round-trips through parseGameConfig + isValidGenerationId at module load (bad preset crashes build, not demo). Preset clicks skip /loading-dream and write directly to localStorage."
      audio/:
        AudioEngine.ts: "Tier S: procedural ambient synthesis for 8 moods. 5-7 detuned oscillators + BiquadFilter + ConvolverNode synthetic IR + dual LFO. State machine: masterGain controls ambient (intro 0.35 → steady 0.5 via setAmbientGainTarget → ducked 0.18 via duck → muted 0). Separate oneShotBus for narrator/stinger SFX — mute-aware but not duck-aware. visibilitychange ramps to 0 on tab-hidden. MP3 override at /audio/ambient-<mood>.mp3 (404 = procedural)."
        stingers.ts: "Tier S: three procedural Web Audio one-shots — playWorldOpen (rising chord 1.5 s), playWin (major-9 chord + noise hit 3 s), playLose (tritone + sub-bass + ConvolverNode reverb 2 s). Each calls engine.duck() and routes through engine.getOneShotBus() for mute compatibility."
      game-config-schema.ts: "Phase 2: zod schema + parseGameConfig / parseGameConfigExtended normalizer (lenient, never throws). normalizeGenre() is unconditional — always '3d_platformer'."
      generation-id.ts: "Phase 3: ID_PATTERN, isValidGenerationId, normalizeGenerationId, newGenerationId (UTC timestamp + 8 hex)"
      generated-paths.ts: "Phase 3: path-safe builders for public/generated/<id>/ and public/generated3d/<id>/ — buildAssetFsPath / buildAssetUrl / ensureAssetDir / isSafeFilename"
      api-errors.ts: "Phase 5: badRequest / unprocessable / fallbackOk / logApiError / redactSecrets"
      game-assets.ts: "Phase P0: GameAssets type, mergeAssetResponses, DREAM_ASSETS_UPDATED_EVENT, isGameAssets guard. Disambiguates 2D vs 3D character_url between routes."
      __tests__/: "Phase 11 + P0: Vitest tests for the lib helpers — 7 files / 213 tests (all green)"
    e2e/:
      smoke.spec.ts: "11 e2e cases (home, loading, play, modal, responsive, redirects)."
    playwright.config.ts: "Playwright config: headless Chromium, NEXT_PUBLIC_DEV_FAKE_AI=1 via webServer."
    public/:
      generated/: "Runtime SD output — gitignored; per-generationId subdirs (Phase 3)"
      generated3d/: "Runtime TRELLIS output — gitignored; per-generationId subdirs (Phase 3)"
    .env: "LOCAL ONLY — never committed. See .env.local.example"
    .env.local.example: "Documented env vars (Phase C)"
    AGENTS.md: "AI-agent note: Next.js 16 has breaking changes vs. training-data Next.js; read node_modules/next/dist/docs first"
    CLAUDE.md: "Imports AGENTS.md"
  godot/:
    main.tscn, project.godot: "Godot 4 project shell (WebGL export target, EXPERIMENTAL — see LEGACY.md)"
    scripts/: "GDScript: GameLoader, LevelGenerator, Player, AtmosphereController, Main"
    shaders/: "Shader files (terrain, dream_object)"
    assets/: "Static + runtime-written GLBs (runtime ones are gitignored)"
    scenes/: "Empty — scene .tscn files referenced by LevelGenerator have not been built"
  agents/:
    __init__.py: "Package marker (effectively empty)"
    analyzer.py: "WorldAnalyzer — LLM → world JSON (LEGACY)"
    builder.py: "WorldBuilder — per-object SD + TRELLIS pipeline writing godot/assets/ (LEGACY)"
  main.py: "Python Gradio 6.x orchestrator entry (LEGACY)"
  requirements.txt: "Python deps (legacy path): gradio, httpx, gradio_client, python-dotenv"
  FIX_PLAN.md: "Audited 5-phase fix plan (A–E) for the original infinite-loading bug"
  README.md: "Top-level project README (rewritten Phase 9)"
  TROUBLESHOOTING.md: "Common errors + fixes (Phase 9)"
  LEGACY.md: "Canonical statement on which parts are experimental / not in demo path (Phase 10 — Option A)"
  docs/:
    PROJECT_MAP.yaml: "This file"
    PRODUCTION_PLAN.md: "Future production architecture plan — NOT yet implemented"
  memory.md: "Dynamic state + session log"
  agent.md: "Behavior rules"

# ==============================================================================
# API surface (Next.js route handlers)
# ==============================================================================
api:
  base_url: "http://localhost:3000"
  public_paths: ["/*"]   # no auth in MVP
  auth_header: none
  endpoints:
    generation:
      - "POST /api/analyze — body: {dream:string} (trimmed, ≤5000 chars). Returns normalized GameConfig JSON via zod + parseGameConfigExtended. SYSTEM_PROMPT is a creative-director brief with per-mood disambiguation, semantic palette roles (hero/mid/deep/anchor), and qualitative guidance for narrative (2-3 sentences / 30-60 words present tense / quote one specific image from the dream), main_character.description (6-12 words covering silhouette + material + posture — directly feeds /api/generate-mesh), music_prompt (genre + BPM + 2-3 instruments + emotion, 10-16 words), goal (5-10 word poetic command), platforms/enemy_count (qualitative thresholds). The user-turn message names the dreamer as protagonist and asks the LLM to extend (not summarize) specific imagery. LM Studio is called with response_format.json_schema (strict) so the model is FORCED to emit conforming JSON (LM Studio rejects OpenAI's `json_object`; only `json_schema` or `text` accepted). Qwen3 reasoning suppressed via chat_template_kwargs.enable_thinking:false + /no_think directive — otherwise <think> blocks consume the max_tokens budget and the truncated payload fails JSON.parse. LLM_TIMEOUT_MS env-configurable (default 60000). Always 200 — falls back to buildFallback(dream) on any LLM error. 400 on invalid body. Raw model content logged on parse failure for diagnostics."
      - "POST /api/generate-3d — body: {config:object, generationId?:string}. config is validated through parseGameConfigExtended (no deep-trust). Pipeline: SD reference PNG → TRELLIS (/preprocess_image → /image_to_3d → /extract_glb). Default backend microsoft/TRELLIS.2 (v2, PBR-materials, 3-stage pipeline); v1 JeffreyXiang/TRELLIS-image-large still supported by setting TRELLIS_URL. Auto-detection via /trellis\\.?2/i regex; v2 sends 15 positional args including Resolution (512) and 3-stage gs/gr/steps/rescaleT, /extract_glb uses Decimation Target=60000 instead of mesh_simplify_ratio. Writes to public/generated3d/<generationId>/{character,prop,portal}.glb. Response: {character_url, prop_url, portal_url, generated, total, log, generationId, wrote_godot, message}. Returns fallbackOk({fallback:true,...}) if HF_TOKEN missing, HF Space sleeping, or local TRELLIS unreachable."
      - "POST /api/generate-assets — body: {config:object, generationId?:string}. config is validated through parseGameConfig. Writes to public/generated/<generationId>/{background,character,platform}.png. Response: {background_url, character_url, platform_url, generated, generationId, message}. ~2s SD health probe; returns nulls if SD offline (never blocks /play)."
      - "POST /api/generate-narration — body: {narrative:string (truncated at 600), mood:string (defaults to surreal_calm on unknown), generationId:string}. Calls ElevenLabs Turbo v2.5 with mood-specific voice IDs (Adam/Bella/Rachel/Drew/Antoni/Domi) and per-mood stability/style settings. Writes MP3 to web/public/generated-tts/<generationId>.mp3 — gitignored. Cache-first: existing file → returns {source:'cached'} without calling ElevenLabs. Returns {audio_url, source, durationSec}. Never 500: missing ELEVENLABS_API_KEY OR network error → {source:'no-tts', audio_url:null}. Client falls back to Web Speech API."
      - "POST /api/generate-mesh — body: {description:string (≤300 chars), mood?:string (≤40), style?:string (≤40), generationId?:string}. mood + style are interpolated into the user-turn message so LLaMA-Mesh adjusts topology (angular for nightmare/cyber, round for cozy/whimsical, crystalline for ethereal/cosmic). Calls LM Studio multi-model server with model=MESH_MODEL (default 'llama-mesh', i.e. bartowski's GGUF of Zhengyi/LLaMA-Mesh, ~4.92 GB Q4_K_M, loaded alongside the analysis Qwen via LM Studio 0.4+). Strips markdown fences and <think>/preamble, keeps OBJ lines (v / vn / vt / f / g / o / #), validates that the payload has at least one vertex AND one face. Writes to public/generated3d/<generationId>/character.obj. Response: {character_obj_url, generationId, generated}. MESH_TIMEOUT_MS env (default 120000 — LLaMA-Mesh is token-by-token slow, ~50-60s per asset). Always 200 — fallbackOk({character_obj_url:null, fallback:true}) when LM Studio is down or LLaMA-Mesh is not loaded."

# ==============================================================================
# Frontend pages
# ==============================================================================
frontend:
  spa_router: Next.js App Router (file-system)
  pages:
    user:
      - "app/page.tsx — landing / dream input"
      - "app/loading-dream/page.tsx — generation orchestration with hard timeout (Phase A)"
      - "app/play/page.tsx — game view (guards on gameConfig in localStorage)"
  cache_strategy: "localStorage keys: dreamText, gameConfig, gameAssets, generationId, audioMuted (Tier S), audioToastShown (Tier S)"

# ==============================================================================
# Environment variables
# ==============================================================================
env:
  required_always: {}
  optional:
    QWEN_BASE_URL: "Local LLM endpoint (OpenAI-compatible). Default http://localhost:1234 (LM Studio). Ollama also works at http://localhost:11434."
    QWEN_MODEL: "Model id reported by the local server's /v1/models list. Code default is qwen3-coder-30b-a3b-instruct-mlx (Apple-Silicon MLX build, will NOT run on Windows/Linux). On Windows the recommended replacement is qwen3-8b-gemini-3-pro-preview-distill (Q6_K GGUF, ~6.7 GB, JSON-schema friendly, ~15-20s response under LM Studio 0.4)."
    SD_BASE_URL: "Automatic1111 SD endpoint. Default http://127.0.0.1:7860"
    TRELLIS_URL: "HF Space id or http URL. Default `microsoft/TRELLIS.2` (4B image-to-3D with PBR materials, 3-stage pipeline, 512/1024/1536 resolution presets). Fallback to `JeffreyXiang/TRELLIS-image-large` (v1, no PBR) by setting this env. /api/generate-3d auto-detects v2 by URL substring and switches param shape (15 positional args in image_to_3d + Decimation Target replaces mesh_simplify_ratio in extract_glb)."
    HF_TOKEN: "Required when TRELLIS_URL is an HF Space. Get a free token at huggingface.co/settings/tokens."
    LLM_TIMEOUT_MS: "Server-side fetch timeout inside /api/analyze for the LLM call. Default 60000 (was hardcoded 25000 — too tight for 8B models on CPU/modest GPU; previously caused silent fallbacks)."
    MESH_MODEL: "Model id for /api/generate-mesh — must match what LM Studio exposes for LLaMA-Mesh. Default 'llama-mesh' (bartowski/LLaMA-Mesh-GGUF Q4_K_M)."
    MESH_TIMEOUT_MS: "Server-side fetch timeout for /api/generate-mesh. Default 120000. LLaMA-Mesh streams OBJ token-by-token, ~50-60s per object on Q4_K_M."
    ELEVENLABS_API_KEY: "Tier S narrator. Set to a sk_... key from https://elevenlabs.io/app/settings/api-keys. Free tier ~10k chars/month covers the hackathon. If missing/empty, /api/generate-narration returns {source:'no-tts'} and CinematicIntro falls back to browser Web Speech API."
    SD_BACKEND: "Image-gen backend selector. 'fal' (default for demo) = fal.ai FLUX schnell. 'a1111' = local Automatic1111 WebUI at SD_BASE_URL. Read once by web/lib/image-gen.ts."
    FAL_API_KEY: "fal.ai API key (UUID:secret form, ~69 chars). Required when SD_BACKEND=fal. Get one at https://fal.ai/dashboard/keys; $5+ balance covers ~1500 schnell images."
    FAL_MODEL: "fal.ai model slug. Default 'fal-ai/flux/schnell' (4-step distilled, ~1.5s, $0.005/image at square_hd). Switch to 'fal-ai/flux/dev' for higher quality at higher latency + cost."
    TRELLIS_ENABLED: "Set to '1' to attempt image-to-3D via TRELLIS. Default OFF — all known Microsoft TRELLIS HF Spaces are currently in RUNTIME_ERROR/CONFIG_ERROR (May 2026 outage). Re-enable when upstream is fixed; pipeline stays intact behind this flag."
    NEXT_PUBLIC_MAX_GENERATION_MS: "Client hard-timeout on /loading-dream before forcing navigation to /play. Default 75000. Bump to 90000+ when real LLM is wired up so the analyze response can settle before the navigate timer fires."
    NEXT_PUBLIC_DEV_FAKE_AI: "If '1', loading-dream skips all APIs and uses fallback after 3s (great for UI / scene work). Default '0' (real pipeline)."
    WRITE_GODOT_ASSETS: "If literal string '1', generate-3d also writes GLBs into ../../godot/assets/ and dream_config.json into godot/"
  ops:
    NODE_ENV: "development|production"

# ==============================================================================
# Deploy strategies
# ==============================================================================
deploy:
  local_dev:
    command: "cd web && npm install && npm run dev"
    smoke_test: "curl -s http://localhost:3000 | head -5"
  vercel_planned:
    target: Vercel
    deploy_method: "git push (planned)"
    health_check: "GET /"
    constraints: ["AI services (Qwen/SD/TRELLIS) run on user's machine, not Vercel"]

deploy_rules:
  branch_discipline:
    - "Work only in `test`. Never push directly to `main`."
    - "Merge `test` → `main` ONLY on user's explicit signal: literal phrase 'merge main now'."
    - "Before `git push` → `git status` mandatory."
  code_changes:
    - "Never commit .env. .env.local.example is the documented template."
    - "PROJECT_MAP.yaml + memory.md updated in same session as code changes (Convention 2)."
  commit_format:
    types: [feat, fix, docs, refactor, test, chore, perf]

# ==============================================================================
# Testing
# ==============================================================================
testing:
  backend:
    framework: vitest
    location: web/lib/__tests__
    runners:
      - "cd web && npm run test"
      - "cd web && npm run check"
      - "cd web && npm run test:e2e"
      - "cd web && npm run check:full"
  frontend:
    automation: "Playwright 1.49 (11 smoke cases in web/e2e)"
    manual_flow:
      - "1. cd web && npm run dev"
      - "2. Open http://localhost:3000, enter dream, click Craft My Game"
      - "3. Verify /loading-dream reaches /play within ≤ NEXT_PUBLIC_MAX_GENERATION_MS"
      - "4. Verify scene renders, WASD moves player, Space jumps, portal wins"
  syntax_checks:
    typescript: "cd web && npx tsc --noEmit"
    eslint: "cd web && npm run lint"

# ==============================================================================
# Known issues
# ==============================================================================
known_issues:
  lucide_react_version_suspect:
    where: web/package.json
    symptom: "lucide-react@^1.16.0 — unusually high version, may indicate wrong package"
    workaround: "Works; do not touch before demo."
  trellis_total_time:
    where: web/app/api/generate-3d/route.ts
    symptom: "Sequential 3-asset TRELLIS run can easily exceed the 60s per-request deadline; later prompts are skipped with `deadline reached, skipping rest`."
    workaround: "Acceptable for MVP — /play already navigated by client hard-timer. Future: parallelize per-asset TRELLIS sessions or move TRELLIS to a background queue."
  scenes_dir_empty:
    where: godot/scenes/
    symptom: "LevelGenerator.gd references player.tscn / platform.tscn / enemy.tscn / goal.tscn that do not exist."
    workaround: "Godot path is EXPERIMENTAL — not blocking the web demo. See LEGACY.md."

# ==============================================================================
# External services
# ==============================================================================
external_services:
  optional:
    qwen_via_lm_studio: "Local LLM for dream→config. http://localhost:1234/v1/chat/completions"
    qwen_via_ollama: "Alternative — http://localhost:11434/v1/chat/completions"
    stable_diffusion_a1111: "Local SD WebUI for 2D + reference images. http://127.0.0.1:7860"
